name: Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup Test Database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./test.db"

      - name: Build
        run: npm run build
        env:
          # CI build environment variables
          DATABASE_URL: "file:./test.db"
          AUTH_SECRET: "test-secret-for-ci-build-only"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "test-secret-for-ci-build-only"
          AUTH_GOOGLE_ID: "test-client-id-for-ci"
          AUTH_GOOGLE_SECRET: "test-client-secret-for-ci"
          GOOGLE_API_KEY: "test-api-key-for-ci"
          GOOGLE_CLIENT_ID: "test-client-id-for-ci"
          GOOGLE_CLIENT_SECRET: "test-client-secret-for-ci"
          GEMINI_API_KEY: "test-gemini-key-for-ci"
          AUTH_TRUST_HOST: "true"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_NAME: "HaberNexus"

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
