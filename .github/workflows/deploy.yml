name: Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup Test Database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./test.db"

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Lint Check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./test.db"
          AUTH_SECRET: "test-secret-for-ci-build-only"
          AUTH_URL: "http://localhost:3000"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "test-secret-for-ci-build-only"

      - name: Check deployment conditions
        id: check
        run: |
          # Deploy only if build succeeds and it's a push to master/main
          echo "should_deploy=true" >> $GITHUB_OUTPUT

  deploy:
    name: Trigger Deployment
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.should_deploy == 'true'

    steps:
      - name: Trigger Webhook
        run: |
          # Webhook URL'si repository secrets'ta tanımlanmalı
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "Triggering deployment webhook..."
            
            # Webhook'a POST isteği gönder
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: push" \
              -H "X-Hub-Signature-256: sha256=$(echo -n '{"action":"deploy","ref":"${{ github.ref }}","sha":"${{ github.sha }}"}' | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" | sed 's/^.* //')" \
              -d '{"action":"deploy","ref":"${{ github.ref }}","sha":"${{ github.sha }}","repository":"${{ github.repository }}","pusher":"${{ github.actor }}"}' \
              "${{ secrets.DEPLOY_WEBHOOK_URL }}" || echo "000")
            
            if [ "$response" = "200" ] || [ "$response" = "202" ]; then
              echo "✅ Deployment webhook triggered successfully"
            else
              echo "⚠️ Webhook response: $response"
              echo "Note: If webhook URL is not configured, deployment will not occur automatically."
              echo "See wiki/Auto-Deployment.md for setup instructions."
            fi
          else
            echo "ℹ️ DEPLOY_WEBHOOK_URL secret is not configured."
            echo "Automatic deployment is disabled."
            echo "To enable auto-deployment, see: wiki/Auto-Deployment.md"
          fi

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Webhook Configured | ${{ secrets.DEPLOY_WEBHOOK_URL != '' }} |" >> $GITHUB_STEP_SUMMARY
